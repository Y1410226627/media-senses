<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Paper collage — parallax camera</title>
<style>
  html, body { margin: 0; height: 100%; background: #cfc4ae; overflow: hidden; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  .layer { position: absolute; inset: -12%; will-change: transform; }
  .layer svg { width: 100%; height: 100%; display: block; }
  #vignette { position: absolute; inset: 0; pointer-events: none;
              background: radial-gradient(ellipse at 50% 46%, rgba(255,255,255,.16), rgba(60,44,26,.34) 78%, rgba(40,28,16,.5)); }
  #grain { position: absolute; inset: 0; pointer-events: none; opacity: .09; mix-blend-mode: multiply; }
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="sky"></div>
  <div class="layer" id="hills"></div>
  <div class="layer" id="town"></div>
  <div class="layer" id="fg"></div>
  <div id="vignette"></div>
  <svg id="grain" viewBox="0 0 100 100" preserveAspectRatio="none"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/></filter><rect width="100" height="100" filter="url(#n)"/></svg>
</div>
<script>
/*
 * Paper collage with a parallax camera: four paper layers at different depths
 * drift at different rates, so a single slow camera move produces real depth
 * without any 3D. The vignette and grain are paper/shot texture, not decoration.
 */
const DEFAULTS = {
  paper: '#cfc4ae',
  sky: '#e8d9bd',
  hills: '#8fa07a',
  town: '#b4603f',
  ink: '#3a2c20',
  accent: '#d8894a',
  // Camera travel at the nearest layer. Below ~80px over five seconds the move
  // stops reading as a camera at all and the shot looks like a still.
  driftX: 150,
  driftY: 46,
  cameraSeconds: 5.5,
}

const cfg = Object.assign({}, DEFAULTS, window.__MS_TEMPLATE || {})
const layers = ['sky', 'hills', 'town', 'fg']
// Depth: farther layers move less (parallax by height).
const depths = { sky: 0.08, hills: 0.28, town: 0.55, fg: 1 }

function svgFor(id) {
  const host = document.getElementById(id)
  const ns = 'http://www.w3.org/2000/svg'
  const svg = document.createElementNS(ns, 'svg')
  svg.setAttribute('viewBox', '0 0 1920 1080')
  svg.setAttribute('preserveAspectRatio', 'xMidYMid slice')
  host.appendChild(svg)
  return svg
}
function shape(svg, tag, attrs) {
  const node = document.createElementNS('http://www.w3.org/2000/svg', tag)
  for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, String(value))
  svg.appendChild(node)
  return node
}

const sky = svgFor('sky')
shape(sky, 'rect', { x: -80, y: -80, width: 2080, height: 1240, fill: cfg.sky })
shape(sky, 'circle', { cx: 1420, cy: 300, r: 118, fill: cfg.accent, opacity: 0.92 })

const hills = svgFor('hills')
shape(hills, 'path', { d: 'M -80 720 C 320 560, 720 780, 1080 640 C 1420 512, 1720 700, 2000 600 L 2000 1200 L -80 1200 Z', fill: cfg.hills, opacity: 0.95 })
shape(hills, 'path', { d: 'M -80 830 C 260 740, 640 900, 1000 800 C 1380 690, 1700 860, 2000 780 L 2000 1200 L -80 1200 Z', fill: cfg.hills, opacity: 0.8 })

const town = svgFor('town')
for (let index = 0; index < 9; index += 1) {
  const x = 120 + index * 205
  const h = 150 + ((index * 73) % 190)
  shape(town, 'rect', { x, y: 900 - h, width: 132, height: h, fill: cfg.town, opacity: 0.92 })
  shape(town, 'path', { d: 'M ' + (x - 16) + ' ' + (900 - h) + ' L ' + (x + 66) + ' ' + (900 - h - 62) + ' L ' + (x + 148) + ' ' + (900 - h) + ' Z', fill: cfg.ink, opacity: 0.85 })
}
shape(town, 'rect', { x: -80, y: 900, width: 2080, height: 260, fill: cfg.ink, opacity: 0.12 })

const fg = svgFor('fg')
shape(fg, 'path', { d: 'M -80 1010 C 300 940, 700 1040, 1100 980 C 1500 920, 1780 1010, 2000 970 L 2000 1200 L -80 1200 Z', fill: '#6d5a44' })
shape(fg, 'path', { d: 'M 210 1010 L 210 830 M 210 880 L 300 840', stroke: cfg.ink, 'stroke-width': 9, fill: 'none', 'stroke-linecap': 'round' })

const smoothstep = (x) => { const v = Math.max(0, Math.min(1, x)); return v * v * (3 - 2 * v) }
const easeInOut = (x) => { const v = Math.max(0, Math.min(1, x)); return v < 0.5 ? 2 * v * v : 1 - Math.pow(-2 * v + 2, 2) / 2 }

window.renderAt = async function (t) {
  const p = easeInOut(t / cfg.cameraSeconds)
  for (const id of layers) {
    const depth = depths[id]
    const dx = -cfg.driftX * depth * p
    const dy = -cfg.driftY * depth * p
    // A near layer also scales slightly, which is what sells the dolly.
    const scale = 1 + 0.02 * depth * p
    document.getElementById(id).style.transform =
      'translate3d(' + dx.toFixed(2) + 'px,' + dy.toFixed(2) + 'px,0) scale(' + scale.toFixed(4) + ')'
  }
  document.getElementById('grain').style.opacity = String(0.07 + 0.02 * smoothstep(t / 1.2))
}
</script>
</body>
</html>
