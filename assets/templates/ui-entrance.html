<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>UI entrance</title>
<style>
  html, body { margin: 0; height: 100%; background: var(--ms-bg, #12141b); overflow: hidden;
               font-family: var(--ms-font, "Microsoft YaHei", sans-serif); }
  /* Authored at 1920x1080 and scaled to the viewport. */
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
           display: grid; place-items: center; transform-origin: 0 0; }
  #panel { position: relative; }
  .card { position: absolute; border-radius: 18px; background: var(--ms-card, #1d2130);
          box-shadow: 0 18px 46px rgba(0,0,0,.45); color: var(--ms-ink, #eef0f5);
          padding: 26px 30px; box-sizing: border-box; will-change: transform, opacity, filter; }
  .kicker { font-size: 22px; letter-spacing: .12em; color: var(--ms-muted, #8b8f9a); }
  .headline { font-size: 46px; font-weight: 800; margin-top: 8px; }
  .meta { font-size: 24px; color: var(--ms-muted, #8b8f9a); margin-top: 10px; }
</style>
</head>
<body>
<div id="stage"><div id="panel"></div></div>
<script>
/*
 * UI entrance: cards arrive bottom-up with a short stagger, each on its own
 * ease-out, and the last thing to move is the accent rule. Nothing floats or
 * breathes afterwards — a card that keeps drifting reads as a defect.
 */
const DEFAULTS = {
  cards: [
    { kicker: '第一步', headline: '把素材变成数字', meta: '镜头 / 节奏 / 调色' },
    { kicker: '第二步', headline: '照着数字重构', meta: '代码动画 + 合成器' },
    { kicker: '第三步', headline: '验收，不像就改', meta: '门禁 + 承接分' },
  ],
  bg: '#12141b',
  card: '#1d2130',
  ink: '#eef0f5',
  muted: '#8b8f9a',
  width: 720,
  cardHeight: 190,
  gap: 26,
  enter: 0.55,
  stagger: 0.16,
  rise: 58,
}

const cfg = Object.assign({}, DEFAULTS, window.__MS_TEMPLATE || {})
document.documentElement.style.setProperty('--ms-bg', cfg.bg)
document.documentElement.style.setProperty('--ms-card', cfg.card)

const panel = document.getElementById('panel')
const totalHeight = cfg.cards.length * cfg.cardHeight + (cfg.cards.length - 1) * cfg.gap
panel.style.width = cfg.width + 'px'
panel.style.height = totalHeight + 'px'

const cards = cfg.cards.map((card, index) => {
  const node = document.createElement('div')
  node.className = 'card'
  node.style.width = cfg.width + 'px'
  node.style.height = cfg.cardHeight + 'px'
  node.style.top = (index * (cfg.cardHeight + cfg.gap)) + 'px'
  node.innerHTML =
    '<div class="kicker"></div><div class="headline"></div><div class="meta"></div>'
  node.querySelector('.kicker').textContent = card.kicker || ''
  node.querySelector('.headline').textContent = card.headline || ''
  node.querySelector('.meta').textContent = card.meta || ''
  panel.appendChild(node)
  return node
})

const easeOut = (x) => { const v = Math.max(0, Math.min(1, x)); return 1 - Math.pow(1 - v, 3) }

// Author at 1920x1080, scale to the render viewport.
const stage = document.getElementById('stage')
function fitStage() {
  stage.style.transform = 'scale(' + Math.min(window.innerWidth / 1920, window.innerHeight / 1080).toFixed(5) + ')'
}
fitStage()
window.addEventListener('resize', fitStage)

window.renderAt = async function (t) {
  for (let index = 0; index < cards.length; index += 1) {
    const start = index * cfg.stagger
    const p = easeOut((t - start) / cfg.enter)
    cards[index].style.opacity = String(Math.min(1, p * 1.3))
    cards[index].style.transform = 'translateY(' + ((1 - p) * cfg.rise).toFixed(2) + 'px)'
    // A little blur that clears as the card lands: reads as depth, not as a filter.
    cards[index].style.filter = p < 0.995 ? 'blur(' + ((1 - p) * 5).toFixed(2) + 'px)' : 'none'
  }
}
</script>
</body>
</html>
